<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUMAN IN THE LOOP — preview</title>
<link rel="icon" href="data:,">
<style>
  :root { --green: #12e27a; --ink: #e9ecea; --dim: #7d8588; --bg: #050607; --panel: rgba(13,15,16,.88); --line: #23282b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #c { display: block; background: #000; max-width: 100vw; max-height: 100vh; }
  body.export #c { max-width: none; max-height: none; }
  body.export #ui, body.hide #ui { display: none; }
  #ui { position: fixed; inset: auto 0 0 0; padding: 10px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.72) 40%); display: grid; gap: 8px; }
  #row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
  button:hover { border-color: var(--green); }
  button.on { color: #04140b; background: var(--green); border-color: var(--green); }
  #time { font-variant-numeric: tabular-nums; min-width: 22ch; }
  #shot { color: var(--green); min-width: 12ch; }
  #lyric { color: var(--dim); flex: 1; min-width: 20ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #scrub { position: relative; height: 26px; cursor: pointer; }
  #track { position: absolute; inset: 9px 0; background: #1a1e20; border-radius: 2px; overflow: hidden; }
  #track i { position: absolute; top: 0; bottom: 0; border-left: 1px solid #000; }
  #track i:nth-child(odd) { background: #262c2f; }
  #track i:nth-child(even) { background: #1d2224; }
  #head { position: absolute; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; background: var(--green); box-shadow: 0 0 8px var(--green); pointer-events: none; }
  #secs { position: relative; height: 12px; color: var(--dim); font-size: 10px; }
  #secs span { position: absolute; top: 0; white-space: nowrap; border-left: 1px solid #333; padding-left: 3px; }
  #shots { position: fixed; top: 0; right: 0; bottom: 96px; width: 220px; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 6px 0; display: none; }
  body.list #shots { display: block; }
  body.hide #shots { display: none; }
  #shots div { padding: 2px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; color: var(--dim); }
  #shots div:hover { color: var(--ink); }
  #shots div.on { color: var(--green); }
  #msg { position: fixed; top: 10px; left: 12px; color: #ff8a80; white-space: pre-wrap; max-width: 70vw; pointer-events: none; }
  #help { color: var(--dim); }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "opentype.js": "/node_modules/opentype.js/dist/opentype.module.js"
} }
</script>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="msg"></div>
<div id="shots"></div>
<div id="ui">
  <div id="secs"></div>
  <div id="scrub"><div id="track"></div><div id="head"></div></div>
  <div id="row">
    <button id="play" title="space">play</button>
    <button id="prev" title="[">◂ shot</button>
    <button id="next" title="]">shot ▸</button>
    <button id="fb" title=",">◂ frame</button>
    <button id="ff" title=".">frame ▸</button>
    <button id="loop" title="l">loop shot</button>
    <button id="qual" title="q">quality: draft</button>
    <button id="list" title="s">shots</button>
    <button id="hide" title="h">hide</button>
    <span id="time"></span><span id="shot"></span><span id="lyric"></span>
    <span id="help">space · ←/→ 1 s (shift 5 s) · , . frame · [ ] shot · l loop · q quality · s shots · h hide</span>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
